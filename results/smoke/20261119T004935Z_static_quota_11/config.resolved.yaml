experiment_id: smoke
description: three-tenant control-loop smoke on the in-process mock engine (virtual
  clock)
workload:
  workload_id: three_tenants_v1
  schema_version: 1.0.0
  duration_s: 120.0
  max_requests: null
  max_model_len: 8192
  prompt_mode: synthetic_text
  tenants:
  - tenant_id: A
    workload_class: chat_interactive
    arrival:
      process: poisson
      rate_rps: 2.0
      cv: 1.0
      burst_rate_rps: null
      mean_on_s: null
      mean_off_s: null
    prompt_tokens:
      dist: lognormal
      value: null
      median: 200.0
      sigma: 0.6
      low: null
      high: null
      min: 16
      max: 1024
    max_output_tokens: 512
    sim_output_tokens:
      dist: lognormal
      value: null
      median: 150.0
      sigma: 0.7
      low: null
      high: null
      min: 1
      max: 512
    slo:
      slo_type: interactive
      ttft_deadline_ms: 1000.0
      tpot_target_ms: 60.0
      e2e_deadline_ms: null
    priority_weight: 1.0
  - tenant_id: B
    workload_class: rag_long_prefill
    arrival:
      process: gamma
      rate_rps: 0.5
      cv: 1.5
      burst_rate_rps: null
      mean_on_s: null
      mean_off_s: null
    prompt_tokens:
      dist: lognormal
      value: null
      median: 3000.0
      sigma: 0.4
      low: null
      high: null
      min: 512
      max: 6000
    max_output_tokens: 1024
    sim_output_tokens:
      dist: lognormal
      value: null
      median: 250.0
      sigma: 0.9
      low: null
      high: null
      min: 1
      max: 1024
    slo:
      slo_type: interactive
      ttft_deadline_ms: 3000.0
      tpot_target_ms: 80.0
      e2e_deadline_ms: null
    priority_weight: 1.0
  - tenant_id: C
    workload_class: agent_batch_decode_heavy
    arrival:
      process: onoff
      rate_rps: 0.2
      cv: 1.0
      burst_rate_rps: 6.0
      mean_on_s: 10.0
      mean_off_s: 30.0
    prompt_tokens:
      dist: lognormal
      value: null
      median: 800.0
      sigma: 0.5
      low: null
      high: null
      min: 64
      max: 4096
    max_output_tokens: 2048
    sim_output_tokens:
      dist: lognormal
      value: null
      median: 700.0
      sigma: 0.8
      low: null
      high: null
      min: 1
      max: 2048
    slo:
      slo_type: deadline
      ttft_deadline_ms: 10000.0
      tpot_target_ms: null
      e2e_deadline_ms: 120000.0
    priority_weight: 1.0
backend:
  kind: mock
  base_url: null
  model: mock-model
  model_revision: null
  engine:
    kv_blocks_total: 4096
    block_size: 16
    max_num_seqs: 64
    max_num_batched_tokens: 2048
    max_model_len: 8192
    scheduling_policy: fcfs
    c0_s: 0.004
    c_prefill_s: 4.0e-05
    c_decode_s: 0.0002
    c_ctx_s: 2.0e-07
    calibration_note: UNCALIBRATED placeholder coefficients (no GPU measurement)
  time_scale: 1.0
  sampling:
    temperature: 0.0
  ignore_eos: false
gateway:
  max_queue_wait_s: 60.0
  ledger:
    quotas:
      A: 60000
      B: 60000
      C: 60000
    allow_borrow: true
run:
  drain_s: 60.0
  warmup_s: 0.0
  metrics_interval_s: 0.5
  request_timeout_s: 180.0
  max_requests_cap: 20000
  max_concurrency_cap: 512
  max_experiment_seconds: 3600.0
schedulers:
  fcfs: {}
  static_quota:
    max_inflight_per_tenant: 24
