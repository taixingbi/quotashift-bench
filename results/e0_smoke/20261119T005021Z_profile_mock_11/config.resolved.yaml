experiment_id: e0_smoke
description: reduced E0 grid on the mock engine to validate harness, accounting and
  plots
backend:
  kind: mock
  base_url: null
  model: mock-model
  model_revision: null
  engine:
    kv_blocks_total: 4096
    block_size: 16
    max_num_seqs: 64
    max_num_batched_tokens: 2048
    max_model_len: 8192
    scheduling_policy: fcfs
    c0_s: 0.004
    c_prefill_s: 4.0e-05
    c_decode_s: 0.0002
    c_ctx_s: 2.0e-07
    calibration_note: UNCALIBRATED placeholder coefficients (no GPU measurement)
  time_scale: 1.0
  sampling:
    temperature: 0.0
  ignore_eos: false
run:
  drain_s: 30.0
  warmup_s: 0.0
  metrics_interval_s: 0.5
  request_timeout_s: 120.0
  max_requests_cap: 20000
  max_concurrency_cap: 512
  max_experiment_seconds: 3600.0
profile:
  prompt_lengths:
  - 256
  - 1024
  - 4096
  - 8192
  output_lengths:
  - 128
  - 512
  concurrencies:
  - 1
  - 4
  - 16
  - 64
  trials: 2
  min_requests_per_cell: 8
  requests_per_slot: 2
  max_model_len: 8192
  ignore_eos: true
  cell_timeout_s: 900.0
  request_timeout_s: 600.0
  warmup_requests: 2
  max_total_seconds: 14400.0
  vocab_low: 1000
  vocab_high: 30000
  rate_sweep:
    prompt_tokens: 1024
    output_tokens: 256
    rates_rps:
    - 1.0
    - 2.0
    - 4.0
    - 8.0
    - 12.0
    - 16.0
    - 24.0
    duration_s: 60.0
    trials: 2
    ttft_deadline_ms: 2000.0
    tpot_target_ms: 100.0
    knee_completion_ratio: 0.95
