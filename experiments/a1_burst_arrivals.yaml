# A1 — burst-shaped competitor arrivals (plan §2).
# Independent variable: temporal concentration of the competitor's offered load.
# Control (generated in-process): the SAME requests re-timed to arrive uniformly
# (primary_control: uniform_arrivals). Request count and input/output token budgets
# are identical to the attack by construction; victim traffic is untouched. Only the
# competitor's arrival timing changes (bursty -> uniform), so any victim degradation
# difference is attributable to temporal concentration, not to extra offered work.
schema_version: 1
scenario_id: a1_burst_arrivals
seed: 42
model: mock-model
model_max_len: 4096
runtime_seconds: 60
endpoint: http://localhost:8080
victim_tenants: [victim_a, victim_b]
competing_tenants: [synthetic_competitor]
budget_class: total_requests
safety:
  max_total_requests: 400
  max_global_inflight: 4
  max_requests_per_tenant: 120
  max_input_tokens_per_request: 1024
  max_output_tokens_per_request: 256
  max_runtime_seconds: 240
  per_request_timeout_seconds: 120
comparison:
  primary_control: uniform_arrivals
  matched_request_budget: true
  matched_token_budget: true
  repetitions: 5
  degradation_metric: ttft_p95
  preregistered_threshold: 1.5
  budget_tolerance: 0.05
benign:
  rate_rps: 0.3
  request_shape: short
  ttft_deadline_ms: 2000
  e2e_deadline_ms: 30000
phases:
  - {name: calm, duration_seconds: 30, pattern: steady, request_shape: short, rate_rps: 2.0}
  - {name: burst, duration_seconds: 30, pattern: burst_bounded, request_shape: short, rate_rps: 2.0}
