# E-series (multi-tenant characterization), protocol v2. Separate from the historical A1–A5 suite.
# NOT YET RUN. Pre-registered fields (threshold/tolerance/metric) are fixed here before any run.
# E6 KV-cache pressure: long-context competitor at rising rate vs rate-matched short control. Run: experiment --live --reps 3 --path direct
schema_version: 1
scenario_id: e6_kv_pressure
protocol_version: 2
expect_prefix_caching: any
seed: 0
model: Qwen/Qwen2.5-7B-Instruct
model_max_len: 4096
runtime_seconds: 180
endpoint: http://localhost:8080
victim_tenants: [v00, v01]
competing_tenants: [longctx]
budget_class: total_requests
safety:
  max_total_requests: 1200
  max_global_inflight: 8
  max_requests_per_tenant: 800
  max_input_tokens_per_request: 3584
  max_output_tokens_per_request: 256
  max_runtime_seconds: 240
  per_request_timeout_seconds: 120
comparison:
  primary_control: rate_matched_short
  matched_request_budget: true
  matched_token_budget: false
  repetitions: 3
  degradation_metric: ttft_p95
  preregistered_threshold: 1.5
  budget_tolerance: 0.05
benign: {rate_rps: 0.3, request_shape: short, ttft_deadline_ms: 1000, e2e_deadline_ms: 30000}
phases:
  - {name: low, duration_seconds: 60, pattern: poisson, request_shape: long_context, rate_rps: 0.2}
  - {name: mid, duration_seconds: 60, pattern: poisson, request_shape: long_context, rate_rps: 0.5}
  - {name: high, duration_seconds: 60, pattern: poisson, request_shape: long_context, rate_rps: 1.0}
