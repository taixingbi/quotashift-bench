# E-series (multi-tenant characterization), protocol v2. Separate from the historical A1–A5 suite.
# NOT YET RUN. Pre-registered fields (threshold/tolerance/metric) are fixed here before any run.
# E4 workload shape: competitor context_heavy vs token-budget-matched short control. Run: experiment --live --reps 5 --path direct
schema_version: 1
scenario_id: e4_shape_prefill
protocol_version: 2
expect_prefix_caching: any
seed: 0
model: Qwen/Qwen2.5-7B-Instruct
model_max_len: 4096
runtime_seconds: 120
endpoint: http://localhost:8080
victim_tenants: [v00, v01, v02]
competing_tenants: [comp]
budget_class: total_requests
safety:
  max_total_requests: 1500
  max_global_inflight: 8
  max_requests_per_tenant: 1000
  max_input_tokens_per_request: 1024
  max_output_tokens_per_request: 256
  max_runtime_seconds: 240
  per_request_timeout_seconds: 120
comparison:
  primary_control: matched_total_short
  matched_request_budget: false
  matched_token_budget: true
  repetitions: 5
  degradation_metric: ttft_p95
  preregistered_threshold: 1.5
  budget_tolerance: 0.05
benign: {rate_rps: 0.3, request_shape: short, ttft_deadline_ms: 1000, e2e_deadline_ms: 30000}
phases:
  - {name: main, duration_seconds: 120, pattern: poisson, request_shape: context_heavy, rate_rps: 0.6}
