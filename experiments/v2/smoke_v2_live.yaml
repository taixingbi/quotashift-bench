# Protocol v2 LIVE HARNESS SMOKE (not a benchmark result): 2 victims + 1 prefill-heavy competitor,
# 20 s, token-matched short control. Validates per-arm nonce, counterbalanced order, per-arm
# prefix-cache snapshots and attribution checks end to end on the self-hosted vLLM.
schema_version: 1
scenario_id: smoke_v2_live
protocol_version: 2
expect_prefix_caching: "on"
seed: 42
model: Qwen/Qwen2.5-7B-Instruct
model_max_len: 4096
runtime_seconds: 20
endpoint: http://localhost:8080
victim_tenants: [victim_a, victim_b]
competing_tenants: [synthetic_competitor]
budget_class: input_tokens
safety:
  max_total_requests: 200
  max_global_inflight: 4
  max_requests_per_tenant: 150
  max_input_tokens_per_request: 512
  max_output_tokens_per_request: 64
  max_runtime_seconds: 60
  per_request_timeout_seconds: 60
comparison:
  primary_control: matched_total_short
  matched_request_budget: false
  matched_token_budget: true
  repetitions: 2
  degradation_metric: ttft_p95
  preregistered_threshold: 1.5
  budget_tolerance: 0.05
benign: {rate_rps: 0.5, request_shape: short, ttft_deadline_ms: 2000, e2e_deadline_ms: 30000}
phases:
  - {name: prefill, duration_seconds: 20, pattern: steady, request_shape: context_heavy, rate_rps: 0.5}
