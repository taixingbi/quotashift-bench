# PROTOCOL v3.1 AMENDMENT (docs/PROTOCOL_V3_1_LONGCTX_AMENDMENT.md) — A9 request-rate-matched cost family `longctx`
# vs short control; primary = GPU dynamic energy per 1k authorized tokens (unchanged from v3).
# Replaces the INVALID v3 block `a9_rate_longctx` (reports/v3/SUITE_S_FORENSIC_AUDIT.md). The ONLY change from
# experiments/v3/a9_rate_longctx.yaml: prompt sizes are in real Qwen2.5 tokens (prompt_token_unit: tokenizer,
# single-token filler, per-request calibration + fail-closed tokenized-context check), with a 32-token prompt floor,
# a new scenario_id and a new isolation_salt. Threshold, metric, direction, rates and shapes are unchanged.
# SMOKE (harness validation only, 1 seed, 40 s; never pooled with the full run).
schema_version: 1
scenario_id: a9_rate_longctx_v31_smoke
protocol_amendment: "3.1"
prompt_token_unit: tokenizer
isolation_salt: v31-longctx-rate-smoke-r1
protocol_version: 3
expect_prefix_caching: "on"
seed: 42
model: Qwen/Qwen2.5-7B-Instruct
model_max_len: 4096
runtime_seconds: 40
endpoint: http://localhost:8080
victim_tenants: [v00, v01, v02]
competing_tenants: [comp]
budget_class: total_requests
safety:
  max_total_requests: 1500
  max_global_inflight: 8
  max_requests_per_tenant: 900
  max_input_tokens_per_request: 3584
  max_output_tokens_per_request: 256
  max_runtime_seconds: 240
  per_request_timeout_seconds: 120
comparison:
  primary_control: rate_matched_short
  matched_request_budget: true
  matched_token_budget: false
  repetitions: 1
  degradation_metric: gpu_energy_per_1k_authorized_tokens
  effect_direction: two_sided
  preregistered_threshold: 1.25
  budget_tolerance: 0.05
  threshold_justification: "1.25x = smallest practically relevant effect on one shared GPU; >= 2x the expected A/A noise half-width (A7-V measures it first; if wider, suite is exploratory). Not inherited from A1-A5."
benign: {rate_rps: 0.3, request_shape: short, ttft_deadline_ms: 2000, e2e_deadline_ms: 30000}
phases:
  - {name: main, duration_seconds: 40, pattern: steady, request_shape: long_context, rate_rps: 0.2}
