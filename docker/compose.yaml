# Local zero-cost stack: mock vLLM backend + QuotaShift gateway. No GPU, no cloud,
# nothing published to the host. Mirrors the deployed topology (gateway -> vLLM)
# for local checks only; results from the mock are simulator plumbing, not GPU data.
#   docker compose -f docker/compose.yaml up --build
# A real local GPU vLLM is opt-in via `--profile gpu` (see docs/REPRODUCIBILITY.md).
name: quotashift
services:
  mock-vllm:
    build: {context: .., dockerfile: docker/Dockerfile}
    command: ["mock-server", "--host", "0.0.0.0", "--port", "8000", "--model", "mock-model"]
    expose: ["8000"]          # internal network only; not published to the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 15

  gateway:
    build: {context: .., dockerfile: docker/Dockerfile}
    entrypoint: ["python", "-m", "uvicorn", "--factory", "quotashift.gateway.app:app_from_env",
                 "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      mock-vllm: {condition: service_healthy}
    expose: ["8080"]          # internal network only; no public listener
    environment:
      QUOTASHIFT_TENANTS: /app/configs/gateway/tenants.example.yaml
      QUOTASHIFT_BACKEND_URL: http://mock-vllm:8000
      QUOTASHIFT_MODEL: mock-model
      QUOTASHIFT_MAX_TOTAL_REQUESTS: "150"
      QUOTASHIFT_MAX_REQUESTS_PER_TENANT: "60"
      QUOTASHIFT_MAX_INPUT_TOKENS: "1024"
      QUOTASHIFT_MAX_OUTPUT_TOKENS: "256"
      QUOTASHIFT_MAX_GLOBAL_INFLIGHT: "4"
      QUOTASHIFT_RUN_DEADLINE_S: "600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      retries: 15

  # Real vLLM on a local NVIDIA GPU (opt-in: `--profile gpu`). Requires NVIDIA Container Toolkit.
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai@sha256:0dc46f74eb0e630675d83101dc66c6441c4475cceedcf9235ee42b87c3affd23  # v0.17.1 (X1 / v5)
    command: ["Qwen/Qwen2.5-7B-Instruct", "--max-model-len", "4096",
              "--gpu-memory-utilization", "0.90", "--no-enable-prefix-caching"]
    ipc: host
    ports: ["127.0.0.1:8000:8000"]   # loopback only
    volumes: ["${HOME}/.cache/huggingface:/root/.cache/huggingface"]
    environment: ["VLLM_NO_USAGE_STATS=1"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
