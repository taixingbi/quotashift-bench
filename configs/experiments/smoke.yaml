# M0 smoke: deterministic virtual-time mock backend. Zero GPU / zero cloud cost.
experiment_id: smoke
description: three-tenant control-loop smoke on the in-process mock engine (virtual clock)
workload: configs/tenants/three_tenants.yaml
backend:
  kind: mock
  model: mock-model
  engine: {kv_blocks_total: 4096, block_size: 16, max_num_seqs: 64, max_num_batched_tokens: 2048, max_model_len: 8192}
gateway:
  max_queue_wait_s: 60
  ledger: {quotas: {A: 60000, B: 60000, C: 60000}, allow_borrow: true}
run: {drain_s: 60, warmup_s: 0, metrics_interval_s: 0.5, request_timeout_s: 180}
schedulers:
  fcfs: {}
  static_quota: {max_inflight_per_tenant: 24}
