# Three virtual tenants sharing ONE vLLM engine / ONE GPU.
# ALL rates, lengths, deadlines and weights are PROVISIONAL PLACEHOLDERS.
# They must be re-calibrated from real E0 measurements before any main comparison
# (docs/EXPERIMENT_PROTOCOL.md §3). `sim_output_tokens` is simulation-only ground truth
# used by mock backends; it is never visible to deployable policies.
workload_id: three_tenants_v1
duration_s: 120
max_model_len: 8192
prompt_mode: synthetic_text
tenants:
  - tenant_id: A
    workload_class: chat_interactive
    arrival: {process: poisson, rate_rps: 2.0}
    prompt_tokens: {dist: lognormal, median: 200, sigma: 0.6, min: 16, max: 1024}
    max_output_tokens: 512
    sim_output_tokens: {dist: lognormal, median: 150, sigma: 0.7, min: 1, max: 512}
    slo: {slo_type: interactive, ttft_deadline_ms: 1000, tpot_target_ms: 60}
    priority_weight: 1.0
  - tenant_id: B
    workload_class: rag_long_prefill
    arrival: {process: gamma, rate_rps: 0.5, cv: 1.5}
    prompt_tokens: {dist: lognormal, median: 3000, sigma: 0.4, min: 512, max: 6000}
    max_output_tokens: 1024
    sim_output_tokens: {dist: lognormal, median: 250, sigma: 0.9, min: 1, max: 1024}
    slo: {slo_type: interactive, ttft_deadline_ms: 3000, tpot_target_ms: 80}
    priority_weight: 1.0
  - tenant_id: C
    workload_class: agent_batch_decode_heavy
    arrival: {process: onoff, rate_rps: 0.2, burst_rate_rps: 6.0, mean_on_s: 10, mean_off_s: 30}
    prompt_tokens: {dist: lognormal, median: 800, sigma: 0.5, min: 64, max: 4096}
    max_output_tokens: 2048
    sim_output_tokens: {dist: lognormal, median: 700, sigma: 0.8, min: 1, max: 2048}
    slo: {slo_type: deadline, ttft_deadline_ms: 10000, e2e_deadline_ms: 120000}
    priority_weight: 1.0
