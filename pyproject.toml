[project]
name = "risksched"
version = "0.1.0"
description = "RISK-Sched research platform: tenant-aware, GPU/KV-aware admission & dispatch for LLM serving (Milestone 0/1 framework)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "httpx>=0.27,<1",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
risksched = "risksched.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risksched"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "gpu: requires a real NVIDIA GPU + vLLM endpoint (opt-in via RISKSCHED_GPU_TESTS=1)",
  "slow: slower integration tests",
]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
